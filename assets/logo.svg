<svg width="460" height="120" viewBox="0 0 460 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">SellerMoney Pro logo</title>
<desc id="desc">Aggressive marketplace fintech logo with upward chart and shield.</desc>
<defs>
  <linearGradient id="g" x1="11" y1="110" x2="124" y2="8" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FF3D00"/>
    <stop offset="0.52" stop-color="#FFB000"/>
    <stop offset="1" stop-color="#C7FF00"/>
  </linearGradient>
  <linearGradient id="t" x1="150" y1="25" x2="420" y2="93" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#B9C2D9"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0.65 0 0 0.45 0 0 0 0 0 0 0 0 .45 0"/>
    <feBlend in="SourceGraphic"/>
  </filter>
</defs>
<rect x="8" y="8" width="104" height="104" rx="26" fill="#090B12" stroke="url(#g)" stroke-width="4"/>
<path d="M33 78L52 59L68 70L90 38" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M33 88H92" stroke="#2B3143" stroke-width="7" stroke-linecap="round"/>
<circle cx="90" cy="38" r="7" fill="#C7FF00"/>
<text x="135" y="56" fill="url(#t)" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-2.2">SellerMoney</text>
<rect x="137" y="72" width="86" height="28" rx="14" fill="url(#g)"/>
<text x="154" y="92" fill="#0B0D13" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">PRO</text>
<text x="236" y="92" fill="#79839B" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">profit engine for sellers</text>
</svg>
